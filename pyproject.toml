[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ael"
version = "0.1.0"
description = "Evidence-first autonomous engineering lab: controlled repair harness"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
ael = "ael.cli:main"

[tool.setuptools.packages.find]
include = ["ael*"]
